# Chromium: the open-source browser Google Chrome is built from (same engine).
# Google Chrome itself may not be redistributed; see README ("Google Chrome").
name = "Chromium"
summary = "Browse the web"
category = "Internet"
source = { debian = "chromium" }
include = ["chromium-common"]
network = true
args = ["--ozone-platform=wayland"]
folders = ["downloads"]
permissions = [{ capability = "sound", purpose = "To play sound." }]
build = 1

# Bitwarden comes with Chromium and is where passwords are saved (Chromium's
# own password saving is off, so there is one place for them).
[write]
"etc/chromium/policies/managed/iliada.json" = '''
{
  "PasswordManagerEnabled": false,
  "ExtensionSettings": {
    "nngceckbapebfimnlniiiahkandclblb": {
      "installation_mode": "normal_installed",
      "update_url": "https://clients2.google.com/service/update2/crx",
      "toolbar_pin": "force_pinned"
    }
  }
}
'''
