name = "LibreOffice Writer"
summary = "Write documents"
category = "Office"
source = { debian = "libreoffice-writer" }
# LibreOffice lives in /usr/lib/libreoffice; its core and UNO runtime are
# part of the app rather than ordinary libraries.
include = ["libreoffice-core", "libreoffice-core-nogui", "libreoffice-common", "ure", "uno-libs-private", "libreoffice-base-core", "libreoffice-style-colibre", "libreoffice-gtk3", "libreoffice-uiconfig-common", "libreoffice-uiconfig-writer"]
exec = "usr/lib/libreoffice/program/soffice"
args = ["--writer"]
env = { SAL_USE_VCLPLUGIN = "gtk3" }
folders = ["documents"]
# Debian's install script copies LibreOffice's main configuration into /etc;
# Iliada never runs install scripts, so the recipe does it.
copy = { "etc/libreoffice/registry/main.xcd" = "usr/lib/libreoffice/share/.registry/main.xcd" }
